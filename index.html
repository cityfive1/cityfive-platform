
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityFive Holdings Ltd</title>
</head>

<body>
  <h1>CityFive Holdings Ltd</h1>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="registerButton">Register</button>
  <button id="loginButton">Login</button>

  <p id="message"></p>

  <script>
    const API = "https://pressure-damp-fish.abasthan.app";

    document.getElementById("registerButton").addEventListener("click", async function () {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!email || !password) {
        message.innerText = "Please enter your email and password.";
        return;
      }

      message.innerText = "Creating your account...";

      try {
        const response = await fetch(API + "/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        message.innerText = data.message || "Registration complete.";
      } catch (error) {
        message.innerText = "Unable to connect to the server.";
      }
    });

    document.getElementById("loginButton").addEventListener("click", async function () {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!email || !password) {
        message.innerText = "Please enter your email and password.";
        return;
      }

      message.innerText = "Signing in...";

      try {
        const response = await fetch(API + "/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        message.innerText = data.message || "Login complete.";
      } catch (error) {
        message.innerText = "Unable to connect to the server.";
      }
    });
  </script>
</body>
</html>
